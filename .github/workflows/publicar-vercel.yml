# Publica o site na Vercel a cada push no main.
# (A integração Git da Vercel não dispara deploys deste repositório, então a CLI faz o deploy.)
name: Publicar na Vercel

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: vercel-producao
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: team_EZzWNBn1bIDY16kiQVyO0ZL6
      VERCEL_PROJECT_ID: prj_J5jgQCbFp7m5ckzTk1dAkHnCV7Lh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Deploy de produção
        run: npx --yes vercel@latest deploy --prod --yes --token "${{ secrets.VERCEL_TOKEN }}"
